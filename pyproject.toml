[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smac"
dynamic = ["version"]
description = "Simple Multi-Agent Chat: server + smac-server lifecycle manager + smac TUI client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Server runtime (floors mirroring requirements.txt's pinned versions --
    # requirements.txt remains the source of truth for exact dev/CI pins).
    "fastapi>=0.108.0",
    "uvicorn>=0.31.1",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.11.7",
    "python-dotenv>=1.2.2",
    "PyJWT>=2.13.0",
    "bcrypt>=4.1.1",
    "email-validator>=2.1.0",
    "alembic>=1.18.5",
    "mcp>=1.28.1",
    # Client runtime (smac_cli: smac-server lifecycle manager + smac TUI).
    "httpx>=0.27.2",
    "textual>=8.2.8",
    "websockets>=17.0.1",
]

[project.scripts]
smac-server = "smac_cli.server:main"
smac = "smac_cli.app:main"

[tool.setuptools]
packages = ["app", "app.routers", "smac_cli", "smac_mcp"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }
